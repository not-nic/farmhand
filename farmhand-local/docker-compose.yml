services:
  api:
    build:
      context: ../
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      DATA_API_URL: "http://data-api:8000/api/v1"

      SERVICE_USER_USERNAME: ${SERVICE_USER_USERNAME}
      SERVICE_USER_EMAIL: ${SERVICE_USER_EMAIL}
      SERVICE_USER_PASSWORD: ${SERVICE_USER_PASSWORD}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      FRONTEND_REDIRECT_URL: ${FRONTEND_REDIRECT_URL}
    depends_on:
      - database
      - data-api
    ports:
      - "8000:8000"
  data-api:
    # requires building locally from the farmhand-data-api repository
    image: farmhand-data-api
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "farmhand-data"
    depends_on:
      - database
    ports:
      - "8001:8000"
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh


volumes:
  postgres_data: