[project]
name = "farmhand"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "authlib>=1.7.2",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "starlette>=1.3.1",
    "strenum>=0.4.15",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.1.5",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.17",
]

[tool.ruff]
exclude = [
    "venv",
    ".venv/",
    "__pypackages__",
    ".git",
    ".pyc",
    ".tox",
    "instance",
    "__pycache__",
    ".pytest_cache/",
    ".idea",
    ".github",
]

line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # handled by ruff-format
    "B904"
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true